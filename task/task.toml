schema_version = "1.4"
artifacts = [{ source = "/evidence", destination = "evidence", service = "observer" }]

[task]
name = "local/juice-shop-scoreboard"

[metadata]
category = "security"
difficulty = "hard"

[agent]
timeout_sec = 3600
user = "65532"

[environment]
build_timeout_sec = 300
network_mode = "public"
cpus = 0.5
memory_mb = 256

[verifier]
timeout_sec = 60
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 180
network_mode = "public"
cpus = 1
memory_mb = 512

[[verifier.collect]]
service = "observer"
command = "python /observer.py final"
timeout_sec = 30
